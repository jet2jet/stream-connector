name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  extract-version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $rcFile = "source\main.rc"

          # Extract the line such as PRODUCTVERSION x,y,z,0
          $match = Select-String `
              -Path $rcFile `
              -Pattern '^\s*PRODUCTVERSION\s+(\d+),(\d+),(\d+),(\d+)' |
              Select-Object -First 1

          if (-not $match) {
              throw "PRODUCTVERSION not found"
          }

          # Generate major.minor.patch
          $version = @(
            $match.Matches[0].Groups[1].Value
            $match.Matches[0].Groups[2].Value
            $match.Matches[0].Groups[3].Value
          ) -join '.'

          "version=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Extracted version: $version"
    
  build:
    runs-on: windows-latest
    needs: extract-version
    strategy:
      matrix:
        platform: [x64, x86]

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          vs-version: 'latest'

      - name: Build ${{ matrix.platform }}
        run: |
          msbuild stream-connector.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Prepare artifacts directory
        shell: pwsh
        run: |
          mkdir dist
          $PSNativeCommandUseErrorActionPreference = $true
          if ("${{ matrix.platform }}" -eq "x86") { $dir = "Win32" } else { $dir = "${{ matrix.platform }}" }

          copy out\$dir\Release\*.exe dist\
          copy LICENSE dist\
          copy README.md dist\
          copy CHANGELOG.md dist\

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "stream-connector-${{ matrix.platform }}-${{ needs.extract-version.outputs.version }}.zip"
          path: |
            dist/

  create-release:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" # e.g. v1.2.3
          $version = $tag.TrimStart("v")  # Strip first 'v'
          echo "TAG_NAME=$tag" >> $env:GITHUB_ENV

          $lines = Get-Content CHANGELOG.md
          $start = $lines.IndexOf("## $version")
          if ($start -ge 0) {
            $rest = $lines[($start + 1)..($lines.Count - 1)]
            $bodyLines = @()
            foreach ($line in $rest) {
              if ($line -match "^## ") { break }
              $bodyLines += $line
            }

            $body = $bodyLines -join "`n"
            "RELEASE_BODY<<EOF" >> $env:GITHUB_ENV
            $body >> $env:GITHUB_ENV
            "EOF" >> $env:GITHUB_ENV
          }

      - name: Upload release asset
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: |
            artifacts/*.zip
